name: WordPress version

# Fails once a week while a WordPress release newer than readme.txt's
# "Tested up to" is out: test the plugin on it, then raise the line to that
# release's major and minor (7.2, never 7.2.1). The listing workflow publishes
# that edit without a new version.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tested-up-to:
    name: Tested up to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the newest WordPress
        run: |
          tested=$(sed -n 's/^Tested up to: *\([^ ]*\)$/\1/p' readme.txt | tr -d '\r')
          newest=$(curl -sSf https://api.wordpress.org/core/stable-check/1.0/ | jq -r 'to_entries[] | select(.value == "latest") | .key' | cut -d. -f1,2)
          echo "Tested up to $tested, newest WordPress $newest"
          [ -n "$tested" ] && [ -n "$newest" ]
          if [ "$(printf '%s\n%s\n' "$newest" "$tested" | sort -V | tail -n 1)" != "$tested" ]; then
            echo "::error::WordPress $newest is out: test the plugin on it and raise Tested up to."
            exit 1
          fi
