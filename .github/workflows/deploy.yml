name: Deploy to wordpress.org

# A tag named as a version (1.2.3) releases that version: the plugin's build
# goes to trunk and to tags/<version> in the plugin's Subversion repository,
# and .wordpress-org to its assets folder (the banner, the icon, the
# screenshots and the Live Preview's blueprint). wordpress.org then holds each
# release in a cooldown of about six hours before sites are offered it.
#
# Tag a commit only once CI has passed on it: the build job refuses one it
# hasn't. A failed run is run again on the same tag. A version wordpress.org
# already has is never tagged again: fix it in a new version.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          echo "CI runs passed on $GITHUB_SHA: $passed"
          [ "$passed" -ge 1 ]

      - name: Check the tag names the version the plugin states
        env:
          TAG: ${{ github.ref_name }}
        run: |
          header=$(sed -n 's/^ \* Version: *\([^ ]*\)$/\1/p' iminify-image-optimizer.php)
          stable=$(sed -n 's/^Stable tag: *\([^ ]*\)$/\1/p' readme.txt | tr -d '\r')
          echo "tag $TAG, header $header, stable tag $stable"
          [ "$TAG" = "$header" ] && [ "$TAG" = "$stable" ]

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-dev --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: php bin/build.php
      - run: php bin/check-build.php build/iminify-image-optimizer

      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/iminify-image-optimizer
          strict: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iminify-image-optimizer-${{ github.ref_name }}
          path: |
            build/iminify-image-optimizer
            build/iminify-image-optimizer.zip
          if-no-files-found: error

  deploy:
    name: Release to wordpress.org
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only the listing's assets come from the checkout; the plugin is the
      # build the job before checked, and nothing here installs or runs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .wordpress-org
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iminify-image-optimizer-${{ github.ref_name }}
          path: build

      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: iminify-image-optimizer
          BUILD_DIR: build/iminify-image-optimizer
          ASSETS_DIR: .wordpress-org
