name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding standards and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: composer lint
      - run: composer types
      - run: npm run lint:js

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    name: Integration tests (PHP ${{ matrix.php }}, WordPress ${{ matrix.wordpress }}${{ matrix.multisite && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.9'
          - php: '8.5'
            wordpress: '7.1'
          - php: '8.5'
            wordpress: '7.1'
            multisite: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci

      - name: Start the test WordPress
        run: npm run env:test start
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}-branch

      - name: Check the versions under test
        run: |
          php=$(npm run --silent env:test -- run cli php -r 'echo "php=" . PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION . "\n";' 2>/dev/null | grep -o 'php=[0-9.]*')
          wordpress=$(npm run --silent env:test -- run cli wp eval 'echo "wordpress=" . get_bloginfo( "version" ) . "\n";' 2>/dev/null | grep -o 'wordpress=[0-9.]*')
          echo "$php $wordpress"
          [ "$php" = "php=${{ matrix.php }}" ]
          case "$wordpress" in "wordpress=${{ matrix.wordpress }}"|"wordpress=${{ matrix.wordpress }}."*) ;; *) exit 1 ;; esac

      - run: npm run test:integration
        if: ${{ ! matrix.multisite }}

      - run: npm run test:integration:multisite
        if: ${{ matrix.multisite }}

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run build

      - name: Start the e2e WordPress, whose stub answers for Iminify
        run: npm run env:e2e start

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-dev --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: php bin/build.php

      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/iminify-image-optimizer
          strict: true
