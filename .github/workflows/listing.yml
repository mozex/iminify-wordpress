name: Update the wordpress.org listing

# Between releases, readme.txt and .wordpress-org reach wordpress.org without
# a new version: once CI passes on main's newest commit, and again after each
# deploy, the readme goes to trunk and to the released version's tag (the
# directory reads the listing from there), and .wordpress-org to the assets
# folder. A readme whose Stable tag names a version wordpress.org doesn't have
# yet belongs to a coming release and waits for its deploy, which runs this
# again, so the listing never describes code the directory doesn't serve.
# Nothing else in trunk changes here. This works only while Release
# Confirmation is off for the plugin on wordpress.org, since under it a
# released tag can't be changed.

on:
  workflow_run:
    workflows: [CI, Deploy to wordpress.org]
    types: [completed]
    # main for CI's runs, a version tag for a deploy's.
    branches: [main, '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  update:
    name: Readme and assets
    # A fork's pull request can run a workflow under either name, from a
    # branch that may be called main, so only push runs count.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_branch == 'main') ||
      github.event.workflow_run.name == 'Deploy to wordpress.org'))
    concurrency:
      group: listing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Find main's newest commit and check CI passed on it
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # The CI run that started this passed (the job's condition says so),
          # which the runs list may not show yet.
          if [ "$WORKFLOW" = CI ] && [ "$RUN_SHA" = "$head" ]; then
            passed=1
          else
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$head" --branch main --event push --status success --json databaseId --jq length)
          fi
          echo "main is at $head, CI runs passed on it: $passed"
          if [ "$passed" -ge 1 ]; then
            echo "sha=$head" >> "$GITHUB_OUTPUT"
          else
            echo "CI hasn't passed on main's newest commit yet: its own run comes back here."
          fi

      - if: steps.head.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false

      - name: Check wordpress.org has the version the readme names
        if: steps.head.outputs.sha != ''
        id: stable
        shell: bash
        run: |
          stable=$(sed -n 's/^Stable tag: *\([^ ]*\)$/\1/p' readme.txt | tr -d '\r')
          if [ -z "$stable" ]; then
            echo "::error::No Stable tag read from readme.txt"
            exit 1
          fi
          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://plugins.svn.wordpress.org/iminify-image-optimizer/tags/$stable/readme.txt")
          case "$status" in
            200) echo "released=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "Stable tag $stable isn't on wordpress.org yet: its deploy runs this again." ;;
            *) echo "::error::wordpress.org answered $status for tags/$stable/readme.txt"; exit 1 ;;
          esac

      - if: steps.stable.outputs.released == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: iminify-image-optimizer
          IGNORE_OTHER_FILES: true
